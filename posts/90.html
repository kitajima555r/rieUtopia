<i class="blob b2"></i><i class="blob b3"></i><i class="blob b4"></i></div><header><nav class="pill" aria-label="メインメニュー"><a href="/poems" class="primary" aria-current="page">詩を読む</a><a href="/#about">About</a><a href="https://note.com/riesorairo_" target="_blank" rel="noopener noreferrer">note</a><a href="https://www.instagram.com/rieutopia/" target="_blank" rel="noopener noreferrer">Instagram</a></nav></header><main><article class="glass reader"><header class="reader-head"><div class="reader-meta"><time datetime="2020-09-11">2020-09-11</time><a class="tag" href="/poems?c=poem">詩</a></div><h1>生きる力</h1></header><div class="reader-cover"><img src="/images/wp/4056e821c0c3.jpeg" alt="生きる力" width="1200" height="750"></div><div class="reader-body"><p>生きる力はどこから出てくるのだろう<br>ご飯を食べること？<br>眠ること？<br>お金を稼ぐこと？<br>恋人と過ごすこと？<br>家族を愛すること？</p><p>私の生きる力は<br>どのぐらいあるのだろう？</p><p>疲れてしまった？<br>足が擦り切れて血が出ている<br>また歩き出せるまで…いまは休むの</p><p>生きる力はきっと<br>自分の中にある</p></div><div class="reader-actions"><a class="btn" href="https://twitter.com/intent/tweet?url=https%3A%2F%2Frie-utopia.com%2Fposts%2F90.html&amp;text=%E7%94%9F%E3%81%8D%E3%82%8B%E5%8A%9B" target="_blank" rel="noopener noreferrer">Xで共有</a><a class="btn" href="/poems">一覧へ戻る</a></div><nav class="reader-nav" aria-label="前後の作品"><div><a href="/posts/92.html"><small>← PREVIOUS</small>ちいさなこども</a></div><div class="next"><a href="/posts/89.html"><small>NEXT →</small>いつかきっと</a></div></nav></article></main><footer class="footer glass"><div class="footer-inner"><a href="/" aria-label="Rie-Utopia トップへ"><img src="/images/rie-utopia-logo.png" alt=""></a><nav class="footer-nav" aria-label="フッターメニュー"><a href="/poems">詩を読む</a><a href="/#about">About</a><a href="https://www.instagram.com/rieutopia/" target="_blank" rel="noopener noreferrer">Instagram</a><a href="https://x.com/rieutopia" target="_blank" rel="noopener noreferrer">X</a><a href="https://note.com/riesorairo_" target="_blank" rel="noopener noreferrer">note</a><a href="/feed.xml">RSS</a></nav><p class
