"name":"rie-Utopia"}}</script><link rel="stylesheet" href="/_astro/Base.DUrRNYwJ.css"></head><body><div class="aurora" aria-hidden="true"><i class="blob b1"></i><i class="blob b2"></i><i class="blob b3"></i><i class="blob b4"></i></div><header><nav class="pill" aria-label="メインメニュー"><a href="/poems" class="primary" aria-current="page">詩を読む</a><a href="/#about">About</a><a href="https://note.com/riesorairo_" target="_blank" rel="noopener noreferrer">note</a><a href="https://www.instagram.com/rieutopia/" target="_blank" rel="noopener noreferrer">Instagram</a></nav></header><main><article class="glass reader"><header class="reader-head"><div class="reader-meta"><time datetime="2026-07-04">2026-07-04</time><a class="tag" href="/poems?c=poem">詩</a></div><h1>明日に希望を</h1></header><div class="reader-cover"><img src="https://images.microcms-assets.io/assets/bf187080c2844995a137f4b54b0c4658/5e5aac66e663409b90028a71ef9b1f9c/IMG_5545.jpeg" alt="明日に希望を" width="1200" height="750"></div><div class="reader-body"><p>明日に希望を<br>たとえ空が曇っていても<br>わずかな光で<br>道は見えている<br>一歩ずつ確かな<br>歩みを踏みしめて<br>わたしたちは進んでいる<br>一日いちにちを生きている<br>明日に希望を！<br>胸に不安を抱えていても<br>夜を超え<br>また日が昇る<br>雨が降っても！<br>それを糧に<br>また一歩を踏み出す<br>明日に希望を！</p></div><div class="reader-actions"><a class="btn" href="https://twitter.com/intent/tweet?url=https%3A%2F%2Frie-utopia.com%2Fposts%2Fgnk7uehu7.html&amp;text=%E6%98%8E%E6%97%A5%E3%81%AB%E5%B8%8C%E6%9C%9B%E3%82%92" target="_blank" rel="noopener noreferrer">Xで共有</a><a class="btn" href="/poems">一覧へ戻る</a></div><nav class="reader-nav" aria-label="前後の作品"><div><a href="/posts/l56lsu7plk.html"><small>← PREVIOUS</small>また明日会おうね</a></div><div class="next"><a href="/posts/p4iawkpz260.html"><small>NEXT →</small>魅力</a></div></nav></article></main><footer class="footer glass"><div class="footer-inner"><a href="/" aria-label="Rie-Utopia トップへ"><img src="/images/rie-utopia-logo.png" alt=""></a><nav class="footer-nav" aria-label="フッターメニュー"><a href="/poems">詩を読む</a><a href="/#about">About</a><a href="https://w
